<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#9333ea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="12" fill="url(#gradient)"/>
  <!-- Improved paw print - more defined shape -->
  <!-- Bottom main pad (ellipse for more natural shape) -->
  <ellipse cx="32" cy="50" rx="10" ry="8" fill="white"/>
  <!-- Middle left pad -->
  <circle cx="18" cy="38" r="7" fill="white"/>
  <!-- Middle right pad -->
  <circle cx="46" cy="38" r="7" fill="white"/>
  <!-- Top left pad -->
  <circle cx="22" cy="20" r="6" fill="white"/>
  <!-- Top right pad -->
  <circle cx="42" cy="20" r="6" fill="white"/>
</svg>

