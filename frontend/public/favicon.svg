<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#9333ea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="12" fill="url(#gradient)"/>
  <!-- Professional paw print with better proportions -->
  <!-- Bottom main pad -->
  <ellipse cx="32" cy="48" rx="12" ry="10" fill="white" filter="url(#shadow)"/>
  <!-- Middle left pad -->
  <circle cx="16" cy="36" r="8" fill="white" filter="url(#shadow)"/>
  <!-- Middle right pad -->
  <circle cx="48" cy="36" r="8" fill="white" filter="url(#shadow)"/>
  <!-- Top left pad -->
  <circle cx="20" cy="18" r="7" fill="white" filter="url(#shadow)"/>
  <!-- Top right pad -->
  <circle cx="44" cy="18" r="7" fill="white" filter="url(#shadow)"/>
</svg>

